# NOTE: deploy.py (app/deploy_app.py:write_app_yaml) regenerates this file at
# deploy time with your workspace's values, so nothing workspace-specific is
# committed. The Lakebase connection (PGHOST, PGPORT, PGDATABASE, PGUSER,
# LAKEBASE_ENDPOINT) is filled in then - PGUSER is the app's own service
# principal - along with the Genie space + dashboard ids the deployer created.
# This committed copy is just a template.
command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: ACC_PG_SCHEMA
    value: "acc"
  - name: ACC_CATALOG
    value: ""
  - name: ACC_LLM_MODEL
    value: "databricks-claude-sonnet-4-6"
